# VN3DS-CHARM 3DS packaging config for lovebrew 0.7.x.
# The source directory is generated by `alfons compile` from src/engine/*.moon.

[metadata]
title = "VNDS-LOVE"
author = "VN3DS-CHARM; forked from ajusa/VNDS-LOVE"
description = "VNDS-compatible visual novel engine targeting LÖVE Potion on 3DS"
version = "0.0.13"
icon = "src/engine/icons/icon.png"

[build]
clean = false
targets = ["ctr"]
source = "build/engine/vnds"
saveDir = "build/lovebrew"

[debug]
logging = true
version = "0.7.0"
